<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 130" width="700" height="130">
  <title>NIVAR — Sistema de Marcas</title>
  <desc>A casa e as cinco familias comerciais. Raio zero, sem sombra, traco de espessura variavel por correcao optica. Paleta de incandescencia: cada familia ocupa uma temperatura.</desc>

  <defs>
    <linearGradient id="incandescente" gradientUnits="userSpaceOnUse" x1="24" y1="0" x2="76" y2="0">
      <stop offset="0%" stop-color="#7A1F0D"></stop>
      <stop offset="50%" stop-color="#C17D1F"></stop>
      <stop offset="100%" stop-color="#F5C63C"></stop>
    </linearGradient>
  </defs>

  
  <g id="marca-nivar" transform="translate(15,15)">
    <path d="M24 84 C24 62 24 38 24 16 C50 32 50 68 76 84 C76 62 76 38 76 16" fill="none" stroke="url(#incandescente)" stroke-width="11" stroke-linecap="butt" stroke-linejoin="miter"></path>
  </g>

  
  <g id="familia-intelligence" transform="translate(135,15)">
    <g stroke="#F5C63C" stroke-width="5.5" fill="none">
      <path d="M50 50 L58 18 M50 50 L82 58 M50 50 L42 82 M50 50 L18 42"></path>
      <path d="M58 18 L82 58 M42 82 L18 42"></path>
    </g>
    <g fill="#F5C63C">
      <circle cx="58" cy="18" r="6.5"></circle><circle cx="82" cy="58" r="6.5"></circle>
      <circle cx="42" cy="82" r="6.5"></circle><circle cx="18" cy="42" r="6.5"></circle>
      <circle cx="50" cy="50" r="10"></circle>
    </g>
  </g>

  
  <g id="familia-advisory" transform="translate(255,15)">
    <g fill="none" stroke="#E8A317" stroke-width="6.5" stroke-linecap="round">
      <path d="M14 22 L52 50"></path><path d="M14 50 L52 50"></path><path d="M14 78 L52 50"></path>
    </g>
    <circle cx="66" cy="50" r="14" fill="none" stroke="#E8A317" stroke-width="6.5"></circle>
  </g>

  
  <g id="familia-software" transform="translate(375,15)">
    <g fill="none" stroke="#C17D1F" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M32 20 L14 50 L32 80"></path><path d="M68 20 L86 50 L68 80"></path>
    </g>
    <path d="M40 62 L40 38 L60 62 L60 38" fill="none" stroke="#C17D1F" stroke-width="6" stroke-linejoin="miter"></path>
  </g>

  
  <g id="familia-academy" transform="translate(495,15)">
    <g fill="none" stroke="#A8432A" stroke-width="5.5" stroke-linejoin="miter" stroke-linecap="round">
      <path d="M14 86 L38 46"></path><path d="M86 86 L62 46"></path>
      <path d="M24 70 L76 70"></path>
      <path d="M38 46 L38 32"></path><path d="M62 46 L62 32"></path>
      <path d="M38 32 L62 32"></path>
      <path d="M38 32 L14 22"></path><path d="M62 32 L86 22"></path>
      <path d="M50 32 L50 14"></path>
    </g>
  </g>

  
  <g id="familia-hardware" transform="translate(615,15)">
    <g fill="none" stroke="#B8481F" stroke-width="6.5" stroke-linecap="round">
      <path d="M50 14 L50 30"></path>
      <path d="M18 30 L82 30"></path><path d="M34 44 L66 44"></path>
      <path d="M18 58 L82 58"></path><path d="M34 72 L66 72"></path>
      <path d="M50 72 L50 86"></path>
    </g>
  </g>

</svg>