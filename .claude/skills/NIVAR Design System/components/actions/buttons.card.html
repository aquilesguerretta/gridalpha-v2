<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Botão</title>
<link rel="stylesheet" href="../../styles.css">
<style>body{width:700px;overflow:hidden}.bl{padding:14px 16px}.bl+.bl{border-top:1px solid var(--rule)}.mode{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:9px;margin-bottom:11px;border-bottom:1px solid var(--rule)}.mode b{font-family:var(--font-display);font-size:15px;font-weight:500;color:var(--text-strong)}.eti{font-family:var(--font-data);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:500;color:var(--text-faint)}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px 8px;align-items:center}.hd{padding-bottom:2px}</style></head>
<body><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { Button } = window.NIVARDesignSystem_0a22a8;
const ESTADOS = ['repouso','hover','press','foco','desabilitado'];
const VARIANTES = ['primario','secundario','terciario'];
function Bloco({ modo, rotulo, nota }) {
  return (
    <div className="bl" {...(modo ? { 'data-mode': modo } : {})}>
      <div className="mode"><b>{rotulo}</b><span className="eti">{nota}</span></div>
      <div className="grid">
        {ESTADOS.map(e => <span key={e} className="eti hd">{e}</span>)}
        {VARIANTES.map(v => ESTADOS.map(e => (
          <Button key={v+e} variant={v} state={e === 'desabilitado' ? undefined : e} disabled={e === 'desabilitado'}>Exportar</Button>
        )))}
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<React.Fragment>
  <Bloco rotulo="Modo claro" nota="hover academy · press brasa" />
  <Bloco modo="noturno" rotulo="Modo noturno" nota="hover advisory · press software" />
</React.Fragment>);
</script></body></html>
