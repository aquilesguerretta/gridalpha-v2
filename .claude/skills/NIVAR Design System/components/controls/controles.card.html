<!-- @dsCard group="Components" viewport="700x448" name="Abas e barra de filtro" subtitle="Aba ativa com fio de 2px da família · filtros com fio individual, sem container ao redor do conjunto" -->
<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Abas e filtro</title>
<link rel="stylesheet" href="../../styles.css">
<style>body{width:700px;overflow:hidden}.g{display:grid;grid-template-columns:1fr 1fr}.bl{padding:14px 16px;display:grid;align-content:start;gap:14px}.bl+.bl{border-left:1px solid var(--rule)}.mode{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:8px;border-bottom:1px solid var(--rule)}.mode b{font-family:var(--font-display);font-size:15px;font-weight:500;color:var(--text-strong)}.eti{font-family:var(--font-data);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:500;color:var(--text-faint)}.nv-filtro__campo{flex:1 1 100%}.nv-filtro__acoes{margin-left:0}</style></head>
<body><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">const { Tabs, FilterBar, Select, NumberInput, Button } = window.NIVARDesignSystem_0a22a8;
function Bloco({ modo, rotulo, nota }) {
  return (
    <div className="bl" {...(modo ? { 'data-mode': modo } : {})}>
      <div className="mode"><b>{rotulo}</b><span className="eti">{nota}</span></div>
      <span className="eti">abas · recorte temporal</span>
      <Tabs items={['horário','semanal','mensal']} familia="intelligence" stateHover="semanal" />
      <span className="eti">abas · sem família, com item desabilitado</span>
      <Tabs items={[{value:'ger',label:'Geração'},{value:'car',label:'Carga'},{value:'int',label:'Intercâmbio',disabled:true}]} />
      <span className="eti">barra de filtro</span>
      <FilterBar
        resumo={['PLD acima de R$ 900,00','Submercado Sul']}
        acoes={<React.Fragment><Button variant="primario" size="compacto">Aplicar</Button><Button variant="terciario" size="compacto">Limpar</Button></React.Fragment>}>
        <Select label="Submercado" options={['Sudeste/Centro-Oeste','Sul','Nordeste','Norte']} />
        <NumberInput label="PLD mínimo" unidade="R$/MWh" defaultValue="900,00" />
      </FilterBar>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<div className="g">
  <Bloco rotulo="Modo claro" nota="fio ativo em intelligence" />
  <Bloco modo="noturno" rotulo="Modo noturno" nota="mesma cor de família" />
</div>);
</script></body></html>
