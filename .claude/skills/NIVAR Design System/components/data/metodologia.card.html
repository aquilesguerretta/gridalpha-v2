<!-- @dsCard group="Components" viewport="1060x1360" name="Metodologia e frescor do dado" subtitle="Disclosure inline ancorado na procedência · três estados de frescor sem semáforo" -->
<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Metodologia e frescor</title>
<link rel="stylesheet" href="../../styles.css">
<style>body{width:1060px;overflow:hidden}.g{display:grid;grid-template-columns:1fr 1fr}.bl{padding:16px 18px;display:grid;grid-template-columns:minmax(0,1fr);align-content:start;gap:13px;background:var(--surface-page)}.bl+.bl{border-left:1px solid var(--rule)}.mode{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-bottom:8px;border-bottom:1px solid var(--rule)}.mode b{font-family:var(--font-display);font-size:15px;font-weight:500;color:var(--text-strong)}.eti{font-family:var(--font-data);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:500;color:var(--text-faint)}.pilha{display:grid;gap:7px}.mob{display:grid;grid-template-columns:343px 343px;border-top:1px solid var(--rule-strong)}.mob .bl{width:343px}</style></head>
<body><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">const { MethodDisclosure, DataFreshness, Provenance } = window.NIVARDesignSystem_0a22a8;
const METODO = {
  metodo: 'Média aritmética do PLD horário do submercado no mês, sem ponderação por carga.',
  fonte: 'CCEE · PLD horário · série SE/CO · planilha de decomposição',
  metodoPublicadoEm: '2025-11-12',
  dadoColetadoEm: '2026-08-04 · 14:30 BRT',
  premissas: ['Horário de verão não aplicado desde 2019.', 'Feriado móvel tratado como dia útil na média.'],
  href: '#metodologia/pld-medio',
};
function Bloco({ modo, largura, rotulo, nota }) {
  const attrs = {};
  if (modo) attrs['data-mode'] = modo;
  if (largura) attrs['data-largura'] = largura;
  return (
    <div className="bl" {...attrs}>
      <div className="mode"><b>{rotulo}</b><span className="eti">{nota}</span></div>
      <span className="eti">frescor do dado · três estados, nenhum colorido</span>
      <div className="pilha">
        <DataFreshness estado="vivo" detalhe="atualizado há 4min" />
        <DataFreshness estado="desatualizado" detalhe="última apuração há 6 dias" />
        <DataFreshness estado="ilustrativa" />
      </div>
      <span className="eti">divulgação de metodologia · gatilho fechado</span>
      <MethodDisclosure {...METODO} fio id={'m1' + (modo || '') + (largura || '')}>
        <Provenance fontes={['ONS', 'CCEE']} recorte="apuração mensal" fio={false} />
      </MethodDisclosure>
      <span className="eti">aberta · a data do método vem antes da data do dado</span>
      <MethodDisclosure {...METODO} fio aberta id={'m2' + (modo || '') + (largura || '')}>
        <Provenance fontes={['ONS', 'CCEE']} recorte="apuração mensal" fio={false} />
      </MethodDisclosure>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<>
  <div className="g">
    <Bloco rotulo="Modo claro" nota="gatilho é texto com fio · nunca ícone de interrogação" />
    <Bloco modo="noturno" rotulo="Modo noturno" nota="mesma ordem de linhas · mesma técnica de desenho" />
  </div>
  <div className="mob">
    <Bloco largura="mobile" rotulo="Móvel claro" nota="343px · gatilho a 44px de toque" />
    <Bloco largura="mobile" modo="noturno" rotulo="Móvel noturno" nota="343px · linha empilha, nada trunca" />
  </div>
</>);
</script></body></html>
