<!-- @dsCard group="Components" viewport="1060x1320" name="Prévia de exportação" subtitle="A folha não tem modo noturno · gradiente de incandescência × tinta sólida para impressora monocromática" -->
<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Prévia de exportação</title>
<link rel="stylesheet" href="../../styles.css">
<style>body{width:1060px;overflow:hidden}.g{display:grid;grid-template-columns:1fr 1fr}.bl{padding:16px 18px 20px;display:grid;grid-template-columns:minmax(0,1fr);align-content:start;gap:14px;background:var(--surface-page)}.bl+.bl{border-left:1px solid var(--rule)}.mode{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-bottom:8px;border-bottom:1px solid var(--rule)}.mode b{font-family:var(--font-display);font-size:15px;font-weight:500;color:var(--text-strong)}.eti{font-family:var(--font-data);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:500;color:var(--text-faint)}.mob{display:grid;grid-template-columns:343px 343px;border-top:1px solid var(--rule-strong)}.mob .bl{width:343px}</style></head>
<body><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">const { ExportPreview } = window.NIVARDesignSystem_0a22a8;
const DOC = {
  titulo: 'PLD médio por submercado',
  subtitulo: 'Série horária consolidada em média mensal, jul 2026',
  fontes: ['ONS', 'CCEE'],
  recorte: 'mensal',
  timestamp: '2026-08-04 · 14:30 BRT',
  colunas: ['Submercado', 'R$/MWh', 'Δ mês'],
  linhas: [['Norte', '198,40', '+2,1 %'], ['Nordeste', '203,10', '−0,8 %'], ['Sudeste/CO', '214,80', '+4,2 %'], ['Sul', '268,40', '+9,1 %'], ['Média', '221,18', '+3,4 %']],
  paginas: 4,
};
function Bloco({ modo, largura, rotulo, nota, par, tratamento }) {
  const [t, setT] = React.useState(tratamento || 'mono');
  const attrs = {};
  if (modo) attrs['data-mode'] = modo;
  if (largura) attrs['data-largura'] = largura;
  return (
    <div className="bl" {...attrs}>
      <div className="mode"><b>{rotulo}</b><span className="eti">{nota}</span></div>
      <ExportPreview {...DOC} par={par} tratamento={t} onTratamento={setT} onGerar={() => {}} />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<>
  <div className="g">
    <Bloco rotulo="Modo claro" nota="os dois tratamentos lado a lado" par />
    <Bloco modo="noturno" rotulo="Modo noturno" nota="painel escuro, folha continua papel" par />
  </div>
  <div className="mob">
    <Bloco largura="mobile" rotulo="Móvel claro" nota="343px · um tratamento por vez" tratamento="mono" />
    <Bloco largura="mobile" modo="noturno" rotulo="Móvel noturno" nota="343px · gradiente só na versão de tela" tratamento="cor" />
  </div>
</>);
</script></body></html>
