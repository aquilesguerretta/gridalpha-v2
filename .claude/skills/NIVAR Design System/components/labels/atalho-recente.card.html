<!-- @dsCard group="Components" viewport="1060x1160" name="Atalho, recente, download e teclado" subtitle="Token de tecla em fio fino · NOVO em versalete de acento · barra de rolagem sem decoração · link de pular" -->
<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Atalho, recente, download</title>
<link rel="stylesheet" href="../../styles.css">
<style>body{width:1060px;overflow:hidden}.g{display:grid;grid-template-columns:1fr 1fr}.bl{padding:16px 18px 20px;display:grid;grid-template-columns:minmax(0,1fr);align-content:start;gap:13px;background:var(--surface-page)}.bl+.bl{border-left:1px solid var(--rule)}.mode{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-bottom:8px;border-bottom:1px solid var(--rule)}.mode b{font-family:var(--font-display);font-size:15px;font-weight:500;color:var(--text-strong)}.eti{font-family:var(--font-data);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:500;color:var(--text-faint)}.acao{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px 14px;padding:9px 0;border-bottom:1px solid var(--rule);font-family:var(--font-body);font-weight:400;font-size:13.5px;color:var(--text-body)}.tit{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;font-family:var(--font-display);font-weight:500;font-size:17px;line-height:1.24;letter-spacing:-.006em;color:var(--text-strong)}.baixas{display:grid;gap:11px}.rolo{height:96px;overflow:auto;border:1px solid var(--rule);padding:10px 12px}.rolo p{font-family:var(--font-body);font-weight:300;font-size:13px;line-height:1.55;color:var(--text-muted);margin:0 0 9px}.mob{display:grid;grid-template-columns:343px 343px;border-top:1px solid var(--rule-strong)}.mob .bl{width:343px}</style></head>
<body><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">const { Shortcut, RecentMarker, DownloadLink, SkipLink, PublicationList, PublicationCard, Provenance } = window.NIVARDesignSystem_0a22a8;
function Bloco({ modo, largura, rotulo, nota }) {
  const attrs = {};
  if (modo) attrs['data-mode'] = modo;
  if (largura) attrs['data-largura'] = largura;
  return (
    <div className="bl" {...attrs}>
      <div className="mode"><b>{rotulo}</b><span className="eti">{nota}</span></div>
      <span className="eti">atalho de teclado · uma tecla por retângulo</span>
      <div>
        <div className="acao"><span>Busca</span><Shortcut teclas={['⌘', 'K']} /></div>
        <div className="acao"><span>Exportar a vista atual</span><Shortcut teclas={['Ctrl', 'Shift', 'E']} /></div>
        <div className="acao"><span>Alternar modo noturno</span><Shortcut>Ctrl+D</Shortcut></div>
      </div>
      <span className="eti">marcador de recente · texto, nunca bolinha</span>
      <div className="tit">O PLD de julho e a curva projetada <RecentMarker /></div>
      <div className="tit">Série horária reprocessada <RecentMarker variant="atualizado" /></div>
      <PublicationList>
        <PublicationCard familia="intelligence" tipo="Nota técnica" titulo="Migração ao mercado livre: o custo do aviso prévio" resumo="O prazo regulatório vale mais que a economia anunciada em 31% dos casos." data="2026-08-04" leitura="6 min" />
        <PublicationCard familia="advisory" tipo="Parecer" titulo="Reajuste de encargo setorial" resumo="Três pontos do cálculo da CDE não sobrevivem ao contraditório." data="2026-07-29" leitura="11 min" />
      </PublicationList>
      <span className="eti">link de download · extensão em peso 500, tamanho em secundário</span>
      <div className="baixas">
        <DownloadLink arquivo="pld-horario-julho-2026.csv" formato="CSV" tamanho="284 KB" nota="Fonte: ONS · CCEE · apuração horária" />
        <DownloadLink arquivo="nota-tecnica-2026-08.pdf" formato="PDF" tamanho="1,2 MB" />
        <DownloadLink arquivo="serie-completa-2021-2026.xlsx" formato="XLSX" tamanho="8,4 MB" disabled />
      </div>
      <span className="eti">barra de rolagem · trilho transparente, cursor em cor de fio, sem seta</span>
      <div className="rolo">
        <p>A apuração de julho fechou acima da curva projetada em junho, e o desvio está na afluência, não na carga.</p>
        <p>A série de 2021 a 2024 foi reprocessada após correção de metodologia na CCEE, e a decomposição horária passou a ser publicada no mesmo dia.</p>
        <p>O aviso prévio de 180 dias corre a partir da denúncia formal do contrato regulado.</p>
      </div>
      <span className="eti">link de pular para o conteúdo · estado de foco</span>
      <SkipLink visivel />
      <Provenance fontes={['ONS', 'CCEE']} recorte="apuração mensal" ilustrativa fio />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<>
  <div className="g">
    <Bloco rotulo="Modo claro" nota="NOVO em brasa · atalho em fio fino" />
    <Bloco modo="noturno" rotulo="Modo noturno" nota="NOVO em intelligence · cursor de rolagem em fio de tinta" />
  </div>
  <div className="mob">
    <Bloco largura="mobile" rotulo="Móvel claro" nota="343px · download quebra em duas linhas" />
    <Bloco largura="mobile" modo="noturno" rotulo="Móvel noturno" nota="343px · token de tecla cresce para 20px" />
  </div>
</>);
</script></body></html>
