<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Navegação</title>
<link rel="stylesheet" href="../../styles.css">
<style>body{width:700px;overflow:hidden}.bl{padding:14px 16px}.bl+.bl{border-top:1px solid var(--rule)}.mode{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:8px;margin-bottom:14px;border-bottom:1px solid var(--rule)}.mode b{font-family:var(--font-display);font-size:15px;font-weight:500;color:var(--text-strong)}.eti{font-family:var(--font-data);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:500;color:var(--text-faint)}.col{display:grid;gap:16px;align-content:start}.rot{display:grid;gap:7px}.linha{display:flex;justify-content:space-between;align-items:baseline;gap:20px}</style></head>
<body><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">const { Nav, NavItem, Breadcrumb, Pagination, ModeToggle } = window.NIVARDesignSystem_0a22a8;
function Bloco({ modo, rotulo, nota }) {
  const [pagina, setPagina] = React.useState(4);
  return (
    <div className="bl" {...(modo ? { 'data-mode': modo } : {})}>
      <div className="mode"><b>{rotulo}</b><span className="eti">{nota}</span></div>
      <div className="col">
        <div className="rot"><span className="eti">item de nav · repouso, hover, ativo</span>
          <Nav>
            <NavItem>Painel</NavItem>
            <NavItem state="hover">Séries</NavItem>
            <NavItem ativo>Contratos</NavItem>
            <NavItem>Metodologia</NavItem>
            <NavItem>Procedência</NavItem>
          </Nav>
        </div>
        <div className="rot"><span className="eti">breadcrumb</span>
          <Breadcrumb items={[{label:'Painel',href:'#'},{label:'Séries',href:'#'},{label:'PLD horário SE/CO'}]} />
        </div>
        <div className="rot"><span className="eti">paginação de tabela</span>
          <Pagination pagina={pagina} porPagina={25} total={28934} onChange={setPagina} />
        </div>
        <div className="rot"><span className="eti">seletor de modo · 150ms</span>
          <div className="linha"><ModeToggle value={modo === 'noturno' ? 'noturno' : 'claro'} onChange={() => {}} /><span className="eti">sem ícone de sol ou lua</span></div>
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<React.Fragment>
  <Bloco rotulo="Modo claro" nota="ativo em brasa" />
  <Bloco modo="noturno" rotulo="Modo noturno" nota="ativo em intelligence" />
</React.Fragment>);
</script></body></html>
