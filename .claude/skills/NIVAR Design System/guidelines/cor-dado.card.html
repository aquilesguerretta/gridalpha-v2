<!-- @dsCard group="Colors" viewport="700x150" name="Cor no dado" subtitle="Direção de mercado, não semântica de UI. Não existe verde de sucesso nem vermelho de erro." -->
<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>Cor no dado</title><link rel="stylesheet" href="../styles.css"><style>body{width:700px;overflow:hidden}.eti{font-family:var(--font-data);font-size:10px;letter-spacing:.09em;text-transform:uppercase;font-weight:500;font-variant-numeric:tabular-nums}.mn{font-family:var(--font-data);font-variant-numeric:tabular-nums lining-nums}.g{display:grid;grid-template-columns:repeat(4,1fr);height:150px;background:var(--tinta)}.g>div{border-left:1px solid var(--rule-ink);padding:14px 14px 12px;display:flex;flex-direction:column;justify-content:space-between}.g>div:first-child{border-left:0}.g .v{font-family:var(--font-data);font-size:27px;font-weight:500;letter-spacing:-.015em;font-variant-numeric:tabular-nums}.g .t{font-family:var(--font-data);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-invert-faint)}.g .d{font-size:11.5px;font-weight:300;color:var(--text-invert-muted);line-height:1.35}</style></head><body><div class="g">
<div><span class="t">alta · hardware</span><span class="v" style="color:#B8481F">+11,4 %</span><span class="d">Preço ou carga em elevação</span></div>
<div><span class="t">baixa · software</span><span class="v" style="color:#C17D1F">−4,8 %</span><span class="d">Preço ou carga em queda</span></div>
<div><span class="t">atenção · advisory</span><span class="v" style="color:#E8A317">214,80</span><span class="d">Fora de faixa esperada</span></div>
<div><span class="t">neutro · cinza</span><span class="v" style="color:#9A9081">0,00</span><span class="d">Sem variação apurada</span></div>
</div></body></html>
