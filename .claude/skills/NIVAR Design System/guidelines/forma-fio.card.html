<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>Fio</title><link rel="stylesheet" href="../styles.css"><style>body{width:700px;overflow:hidden}.eti{font-family:var(--font-data);font-size:10px;letter-spacing:.09em;text-transform:uppercase;font-weight:500;font-variant-numeric:tabular-nums}.mn{font-family:var(--font-data);font-variant-numeric:tabular-nums lining-nums}.g{display:grid;grid-template-columns:1fr 1fr;height:160px}.g>div{padding:14px 16px;display:grid;align-content:start;gap:11px;border-left:1px solid var(--rule)}.g>div:first-child{border-left:0}.r{display:grid;gap:5px}.lb{font-family:var(--font-data);font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--text-faint)}.ink{background:var(--tinta)}.ink .lb{color:var(--text-invert-faint)}</style></head><body><div class="g"><div>

</div><div class="ink">

<div class="r"><span class="lb">raio 0 em tudo · exceto círculo pleno</span><div style="display:flex;gap:8px;align-items:center"><span style="width:16px;height:16px;border:1px solid #524A3D"></span><span style="width:16px;height:16px;border-radius:50%;background:#F5C63C"></span></div></div>
