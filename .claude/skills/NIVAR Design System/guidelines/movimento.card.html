<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>Movimento</title><link rel="stylesheet" href="../styles.css"><style>body{width:700px;overflow:hidden}.eti{font-family:var(--font-data);font-size:10px;letter-spacing:.09em;text-transform:uppercase;font-weight:500;font-variant-numeric:tabular-nums}.mn{font-family:var(--font-data);font-variant-numeric:tabular-nums lining-nums}.g{display:grid;grid-template-columns:150px 1fr;height:150px}.g>div{padding:14px 16px}.g>div+div{border-left:1px solid var(--rule)}.cv{display:block}.ds{display:grid;gap:9px}.rw{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center}.rw .k{font-family:var(--font-data);font-size:11px;font-variant-numeric:tabular-nums;color:var(--text-strong)}.rw .b{height:3px;background:var(--papel-3)}.rw .b i{display:block;height:3px;background:var(--brasa)}.rw .n{font-family:var(--font-data);font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--text-faint)}</style></head><body><div class="g"><div><svg class="cv" viewBox="0 0 100 100" width="112" height="112"><path d="M0 100 L100 100 M0 100 L0 0" stroke="#D5CDB9" stroke-width="1" fill="none"></path><path d="M0 100 C65 100 35 0 100 0" stroke="#7A1F0D" stroke-width="2" fill="none"></path></svg><div class="eti" style="color:var(--text-faint);margin-top:2px">0.65 · 0 · 0.35 · 1</div></div>
<div><div class="ds">
<div class="rw"><span class="k">150ms</span><span class="b"><i style="width:12%"></i></span><span class="n">estado</span></div>
<div class="rw"><span class="k">200ms</span><span class="b"><i style="width:17%"></i></span><span class="n">hover</span></div>
<div class="rw"><span class="k">700ms</span><span class="b"><i style="width:58%"></i></span><span class="n">desenho curto</span></div>
<div class="rw"><span class="k">1200ms</span><span class="b"><i style="width:100%"></i></span><span class="n">desenho longo</span></div>
</div><p style="margin-top:11px;font-size:11.5px;font-weight:300;line-height:1.4;color:var(--text-muted)">Anima: opacidade, cor de texto, cor de fio, <span class="mn" style="font-size:11px">stroke-dashoffset</span>, altura de barra. Sem overshoot, sem bounce.</p></div></div></body></html>
