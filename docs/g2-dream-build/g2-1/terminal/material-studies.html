<h1>Instrument / evidence / reading</h1><p>Current native renders after the focused optical correction. Essential operational text reads at 11–12px; the material priority accepted by critic 03 is preserved. Geography recedes, the central graph dominates, and the reading plane stays independent.</p>
<main><figure><img src="optical-pass/1440-dark.png" alt="Dark instrument and observation lens"><figcaption><b>01 / CENTRAL GRAPH + GLASS LENS</b>The brightest sustained plane belongs to the graph; geography and toolbar recede. The inspected point remains visible.</figcaption></figure><figure><img src="optical-pass/1440-paper.png" alt="Paper instrument with the same hierarchy"><figcaption><b>02 / MINERAL FIELD</b>Warm paper carries the graph against a darker page and geographic substrate, with stronger ink contrast.</figcaption></figure><figure><div class="detail plot"><img src="optical-pass/1440-dark.png" alt="Native trace visible through observation glass"></div><figcaption><b>03 / MATERIAL DETAIL</b>The curve and reference line remain visible through 8px blur. The lens docks above or below the selected point.</figcaption></figure><figure><div class="detail source"><img src="optical-pass/1440-sources.png" alt="Source drawer over blurred instrument"></div><figcaption><b>04 / PROVENANCE OVERLAY</b>The original source drawer preserves the current region and sample time.</figcaption></figure></main></html>
