<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>NIVAR — A energia nos move</title><style>*{box-sizing:border-box}body{margin:0;background:#292336;color:#e8e4d4;font:13px system-ui;height:100vh;display:flex;flex-direction:column}main{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}video{max-width:100%;max-height:100%;background:#e8e4d4}nav{height:52px;display:flex;align-items:center;gap:16px;padding:10px 20px}button,select{padding:6px}output{margin-left:auto;font-variant-numeric:tabular-nums}</style><main><video id="film" playsinline muted preload="metadata" src="/public/g2/g232/hero/nivar-energia-desktop.mp4"></video></main><nav><button id="play">Reproduzir do início</button><button id="pause">Pausar</button><button id="sound">Ativar som</button><select id="variant"><option value="desktop">Desktop 16:9</option><option value="mobile">Mobile 4:3</option></select><output>0.000 s</output></nav><script>const v=document.getElementById('film');play.onclick=()=>{v.currentTime=0;v.play()};pause.onclick=()=>v.paused?v.play():v.pause();sound.onclick=()=>{v.muted=!v.muted;sound.textContent=v.muted?'Ativar som':'Silenciar'};variant.onchange=()=>{v.src='/public/g2/g232/hero/nivar-energia-'+variant.value+'.mp4';v.play()};v.ontimeupdate=()=>document.querySelector('output').textContent=v.currentTime.toFixed(3)+' / '+v.duration.toFixed(3)+' s';</script></html>
