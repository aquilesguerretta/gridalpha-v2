<!doctype html><html lang="pt-BR"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NIVAR — simulação de movimento reduzido</title><script>const originalMatch=window.matchMedia.bind(window);window.matchMedia=q=>q.includes('prefers-reduced-motion')?{matches:true,media:q,onchange:null,addEventListener(){},removeEventListener(){},addListener(){},removeListener(){},dispatchEvent(){return true}}:originalMatch(q);window.history.replaceState(null,'','/br#filme-do-metodo');</script><body><div id="root"></div><output id="qa-motion" style="position:fixed;bottom:0;right:0;z-index:99999;background:#fff;color:#111;padding:8px;font:12px monospace">Simulação reduced-motion · MP4 Hero: 0</output><script>let movieRequests=0;new PerformanceObserver(list=>{for(const e of list.getEntries())if(e.name.includes('/g2/g232/hero/')&&e.name.includes('.mp4'))movieRequests++;document.getElementById('qa-motion').textContent='Simulação reduced-motion · MP4 Hero: '+movieRequests;}).observe({type:'resource',buffered:true});</script><script type="module" src="/src/main.tsx"></script></body></html>
